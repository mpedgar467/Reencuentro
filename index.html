<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150F27">
<title>Para ti 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    /* noche (punto de partida) */
    --tinta:#150F27;
    --tinta-panel:#211A3B;
    --tinta-borde:#2C2449;
    /* amanecer (punto de llegada, el 19) */
    --alba-cielo:#F6C98A;
    --alba-brasa:#F0A48C;
    /* acentos fijos */
    --vela:#E3B577;
    --brasa:#EC8398;
    --papel:#F7F0E3;
    --niebla:#AFA3CF;
    --linea:rgba(247,240,227,0.14);
    /* progreso noche -> amanecer, lo fija el JS como porcentaje */
    --alba:3%;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    background-color:var(--tinta);
    background-image:
      radial-gradient(1px 1px at 18% 12%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 76% 6%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 42% 24%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 88% 34%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 8% 48%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 62% 58%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 28% 74%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 92% 80%, rgba(255,255,255,0.32), transparent),
      linear-gradient(160deg,
        color-mix(in srgb, var(--alba-cielo) var(--alba), var(--tinta)) 0%,
        var(--tinta-panel) 45%,
        var(--tinta) 100%);
    background-attachment:fixed;
    color:var(--papel);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .app{
    width:100%;
    max-width:440px;
    padding:clamp(28px, 8vw, 48px) clamp(18px, 5.5vw, 26px) 90px;
    padding-left:max(clamp(18px, 5.5vw, 26px), env(safe-area-inset-left));
    padding-right:max(clamp(18px, 5.5vw, 26px), env(safe-area-inset-right));
  }

  /* ============ HERO: hoja de ruta ============ */
  .hero{
    position:relative;
    text-align:center;
    margin-bottom:clamp(40px, 10vw, 56px);
    padding:clamp(34px, 8vw, 44px) clamp(16px, 5vw, 22px) clamp(26px, 6vw, 32px);
    border-radius:20px;
    overflow:hidden;
    isolation:isolate;
    border:1px solid var(--linea);
    background:linear-gradient(175deg, rgba(255,255,255,0.03), transparent 55%);
  }
  .hero::before{
    content:'';
    position:absolute; inset:0 0 auto 0; height:7px;
    background:repeating-linear-gradient(-45deg,
      var(--vela) 0 10px, transparent 10px 20px,
      var(--brasa) 20px 30px, transparent 30px 40px);
    opacity:0.55;
  }
  .hero::after{
    content:'';
    position:absolute; inset:auto 0 0 0; height:7px;
    background:repeating-linear-gradient(-45deg,
      var(--vela) 0 10px, transparent 10px 20px,
      var(--brasa) 20px 30px, transparent 30px 40px);
    opacity:0.55;
  }
  .hero-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    z-index:-2; opacity:0;
    transition:opacity 0.7s ease;
  }
  .hero-bg.loaded{opacity:0.32;}
  .hero-shade{
    position:absolute; inset:0; z-index:-1;
    background:radial-gradient(120% 90% at 50% 0%, rgba(21,15,39,0.1), var(--tinta) 82%);
  }
  .floaty{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:-1;}
  .floaty span{position:absolute; bottom:-10%; font-size:1rem; opacity:0; animation:drift linear infinite;}
  @keyframes drift{
    0%{transform:translateY(0) scale(0.8); opacity:0;}
    12%{opacity:0.5;}
    85%{opacity:0.3;}
    100%{transform:translateY(-320px) scale(1.05); opacity:0;}
  }
  .hero .kicker{
    font-family:'Fraunces',serif; font-style:italic; font-weight:400;
    font-size:clamp(0.95rem, 3.6vw, 1.05rem);
    color:var(--niebla); margin:0 0 4px; letter-spacing:0.01em;
  }
  .hero .count{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:clamp(4.4rem, 20vw, 5.4rem);
    line-height:1; margin:6px 0 0;
    background:linear-gradient(180deg, var(--papel), color-mix(in srgb, var(--alba-cielo) var(--alba), var(--vela)));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero .count-label{
    font-size:clamp(0.92rem, 3.6vw, 1rem); color:var(--papel); opacity:0.85;
    margin:8px auto 0; max-width:260px; line-height:1.5;
  }
  .hero .range{
    margin-top:16px; font-size:0.8rem; color:var(--niebla); opacity:0.75;
    font-variant-numeric:tabular-nums;
  }
  .hero .kicker,.hero .count,.hero .count-label,.hero .range,.hero .progress{
    opacity:0; animation:heroIn 0.9s ease forwards;
  }
  .hero .kicker{animation-delay:0.1s;}
  .hero .count{animation-delay:0.25s;}
  .hero .count-label{animation-delay:0.45s;}
  .hero .range{animation-delay:0.6s;}
  .hero .progress{animation-delay:0.75s;}
  @keyframes heroIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .progress{margin:22px auto 0; max-width:210px;}
  .progress-track{height:3px; border-radius:3px; background:rgba(247,240,227,0.12); overflow:hidden;}
  .progress-fill{
    height:100%; border-radius:3px;
    background:linear-gradient(90deg, var(--brasa), var(--vela));
    width:0%; transition:width 1.1s cubic-bezier(.22,.9,.3,1);
  }
  .progress-label{margin-top:8px; font-size:0.72rem; color:var(--niebla); opacity:0.7;}

  /* ============ CAMINO: línea vía aérea + matasellos ============ */
  .path{position:relative; padding-left:38px;}
  .path::before{
    content:''; position:absolute; left:16px; top:6px; bottom:6px; width:3px;
    background:repeating-linear-gradient(180deg,
      var(--vela) 0 7px, transparent 7px 12px,
      var(--brasa) 12px 19px, transparent 19px 24px);
    opacity:0.5; border-radius:2px;
  }
  .node{
    position:relative; display:flex; align-items:center; gap:16px;
    margin-bottom:20px; background:none; border:none; width:100%;
    text-align:left; padding:6px 0; font-family:inherit; color:inherit;
    cursor:default; opacity:0; transform:translateX(-6px);
    animation:nodeIn 0.5s ease forwards;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes nodeIn{ to{opacity:1; transform:translateX(0);} }
  .node.unlocked{cursor:pointer;}
  .node.unlocked:active .node-circle{transform:scale(0.93);}
  .node.unlocked:focus-visible{outline:1.5px solid var(--vela); outline-offset:6px; border-radius:10px;}
  .node-circle{
    flex:none; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:0.98rem;
    background:var(--tinta-panel);
    border:1.5px dashed var(--linea);
    color:var(--niebla); position:relative; z-index:1;
    transition:transform 0.15s ease;
  }
  .node-info{flex:1; min-height:38px; display:flex; flex-direction:column; justify-content:center;}
  .node-day{font-size:0.95rem; font-weight:600;}
  .node-date{font-size:0.78rem; color:var(--niebla); opacity:0.75; margin-top:2px;}
  .node.locked .node-circle{opacity:0.5;}
  .node.locked .node-day{opacity:0.5;}
  .node.locked .node-date{opacity:0.42;}
  .node.unlocked .node-circle{
    border-style:solid; border-color:var(--vela); color:var(--vela);
    box-shadow:0 0 0 0 rgba(227,181,119,0.45);
    animation:pulso 2.6s ease-out infinite;
  }
  .node.unlocked .node-day{color:var(--vela);}
  @keyframes pulso{
    0%{box-shadow:0 0 0 0 rgba(227,181,119,0.4);}
    70%{box-shadow:0 0 0 9px rgba(227,181,119,0);}
    100%{box-shadow:0 0 0 0 rgba(227,181,119,0);}
  }
  .node.final{margin-top:8px;}
  .node.final .node-circle{
    width:46px; height:46px; font-size:1.25rem; border:none;
    background:linear-gradient(155deg, var(--brasa), var(--vela));
    color:var(--tinta);
  }
  .node.final.unlocked .node-circle{background-size:200% 200%; animation:brillo 3.4s ease infinite;}
  @keyframes brillo{0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;}}
  .node.final .node-day{font-family:'Fraunces',serif; font-style:italic; font-size:1.08rem; color:var(--brasa);}
  .node.final.locked .node-circle{background:var(--tinta-panel); color:var(--niebla); opacity:0.5;}
  .node.final.locked .node-day{color:var(--niebla); opacity:0.5;}

  /* ============ POSTAL (overlay/modal) ============ */
  .overlay{
    position:fixed; inset:0; background:rgba(10,7,20,0.84);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; padding-bottom:max(20px, env(safe-area-inset-bottom));
    opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:10;
    overscroll-behavior:contain;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .card{
    width:100%; max-width:400px; max-height:84vh; max-height:84dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:linear-gradient(170deg, #2A2148, var(--tinta-panel) 62%);
    border:1px solid var(--tinta-borde);
    border-radius:14px;
    padding:26px 22px 24px;
    box-shadow:0 26px 60px rgba(0,0,0,0.5);
    transform:translateY(14px) scale(0.97);
    transition:transform 0.3s cubic-bezier(.22,.9,.3,1);
    position:relative;
  }
  .card::before{
    content:''; position:absolute; inset:8px;
    border:1px dashed rgba(247,240,227,0.13);
    border-radius:8px; pointer-events:none;
  }
  .overlay.open .card{transform:translateY(0) scale(1);}
  .card-close{
    display:block; margin-left:auto; background:none; border:none;
    color:var(--niebla); font-size:0.85rem; cursor:pointer;
    padding:6px 0 14px; font-family:inherit; min-height:32px;
  }
  .draw{text-align:center; padding:34px 0;}
  .sello{
    width:64px; height:64px; margin:0 auto; border-radius:50%;
    border:2px solid var(--vela);
    display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; color:var(--vela);
    background:radial-gradient(circle, rgba(227,181,119,0.12), transparent 70%);
    transform:scale(1.5) rotate(-14deg); opacity:0;
    animation:sellar 0.7s cubic-bezier(.2,.9,.25,1.15) forwards;
  }
  @keyframes sellar{
    0%{transform:scale(1.7) rotate(-18deg); opacity:0;}
    55%{transform:scale(0.94) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }
  .draw-label{margin-top:16px; font-size:0.85rem; color:var(--niebla);}
  .reveal{display:none;}
  .reveal.show{display:block; animation:desplegar 0.45s ease;}
  @keyframes desplegar{ from{opacity:0; transform:translateY(6px) scaleY(0.98); transform-origin:top;} to{opacity:1; transform:translateY(0) scaleY(1);} }
  .reveal-day{font-size:0.78rem; color:var(--niebla); letter-spacing:0.01em;}
  .reveal-title{
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:clamp(1.3rem, 5.5vw, 1.45rem); color:var(--vela); margin:6px 0 18px;
  }
  .letter-text{
    font-family:'Fraunces',serif; font-size:clamp(1.02rem, 4vw, 1.1rem);
    line-height:1.75; color:var(--papel); white-space:pre-wrap;
  }
  .letter-text .cursor{display:inline-block; width:2px; background:var(--vela); margin-left:2px; animation:parpadeo 0.9s steps(1) infinite;}
  @keyframes parpadeo{50%{opacity:0;}}
  .media-box{width:100%; border-radius:10px; overflow:hidden; background:#0F0B1F; border:1px solid var(--tinta-borde);}
  .media-box img,.media-box video{display:block; width:100%; max-height:420px; object-fit:cover;}
  .media-fallback{padding:40px 20px; text-align:center; color:var(--niebla); font-size:0.85rem; line-height:1.6;}
  .media-fallback .icon{font-size:1.8rem; display:block; margin-bottom:8px;}
  .caption{margin-top:14px; font-size:0.92rem; color:var(--niebla); line-height:1.6; font-style:italic; font-family:'Fraunces',serif;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
    .hero .kicker,.hero .count,.hero .count-label,.hero .range,.hero .progress,.node,.sello{opacity:1 !important; transform:none !important;}
  }

  /* ============ CANDADO: pantalla de combinación ============ */
  body:not(.unlocked) .app{visibility:hidden;}
  body.unlocked .app{visibility:visible; animation:appIn 0.7s ease;}
  @keyframes appIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .lock{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    padding:24px; padding-bottom:max(24px, env(safe-area-inset-bottom));
    background-color:var(--tinta);
    background-image:
      radial-gradient(1px 1px at 20% 20%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 70% 12%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 45% 60%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 85% 70%, rgba(255,255,255,0.3), transparent),
      linear-gradient(165deg, var(--tinta-panel), var(--tinta) 70%);
    transition:opacity 0.5s ease;
  }
  body.unlocked .lock{opacity:0; pointer-events:none;}
  .lock-card{width:100%; max-width:340px; text-align:center;}
  .lock-kicker{
    font-family:'Fraunces',serif; font-style:italic; font-weight:400;
    font-size:1.02rem; color:var(--niebla); margin:0 0 6px;
  }
  .lock-title{
    font-family:'Fraunces',serif; font-weight:500; font-size:1.3rem;
    color:var(--papel); margin:0 0 26px;
  }
  .lock-dots{display:flex; justify-content:center; gap:12px; margin-bottom:30px;}
  .lock-dot{
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid var(--niebla); opacity:0.55;
    transition:all 0.15s ease;
  }
  .lock-dot.filled{background:var(--vela); border-color:var(--vela); opacity:1; transform:scale(1.1);}
  .lock-card.error .lock-dots{animation:sacudir 0.4s ease;}
  .lock-card.error .lock-dot.filled{background:var(--brasa); border-color:var(--brasa);}
  @keyframes sacudir{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .lock-error-msg{
    height:18px; margin:-18px 0 20px; font-size:0.78rem; color:var(--brasa);
    opacity:0; transition:opacity 0.2s ease;
  }
  .lock-card.error .lock-error-msg{opacity:1;}
  .lock-pad{
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:clamp(10px, 3.5vw, 16px); max-width:280px; margin:0 auto;
  }
  .lock-key{
    aspect-ratio:1; border-radius:50%;
    border:1.5px dashed var(--linea); background:var(--tinta-panel);
    color:var(--papel); font-family:'Fraunces',serif; font-size:1.3rem;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent; cursor:pointer;
    transition:transform 0.12s ease, border-color 0.12s ease;
  }
  .lock-key:active{transform:scale(0.92); border-color:var(--vela); border-style:solid;}
  .lock-key.lock-key-empty{visibility:hidden;}
  .lock-key.lock-key-back{font-family:'Manrope',sans-serif; font-size:1.1rem; color:var(--niebla);}
  .lock-key.pressed{animation:anillo 0.45s ease-out;}
  @keyframes anillo{
    0%{box-shadow:0 0 0 0 rgba(227,181,119,0.6); border-color:var(--vela); border-style:solid;}
    100%{box-shadow:0 0 0 10px rgba(227,181,119,0); border-color:var(--linea); border-style:dashed;}
  }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-card" id="lockCard">
    <p class="lock-kicker">Antes de entrar</p>
    <p class="lock-title">Introduce nuestra fecha</p>
    <div class="lock-dots" id="lockDots"></div>
    <p class="lock-error-msg" id="lockError">Esa no es, inténtalo otra vez</p>
    <div class="lock-pad" id="lockPad"></div>
  </div>
</div>

<div class="app">

  <div class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-shade"></div>
    <div class="floaty" id="floaty"></div>
    <p class="kicker">Correo para cuando estás lejos</p>
    <p class="count" id="countNumber">18</p>
    <p class="count-label" id="countLabel">días para volver a abrazarte</p>
    <p class="range">1 de septiembre — 19 de septiembre</p>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <p class="progress-label" id="progressLabel"></p>
    </div>
  </div>

  <div class="path" id="path"></div>

  <div class="overlay" id="overlay">
    <div class="card">
      <button class="card-close" id="cardClose">cerrar ✕</button>
      <div class="draw" id="draw">
        <div class="sello" id="sello">💌</div>
        <p class="draw-label">abriendo el día...</p>
      </div>
      <div class="reveal" id="reveal">
        <p class="reveal-day" id="revealDay"></p>
        <p class="reveal-title" id="revealTitle"></p>
        <div id="revealBody"></div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============ CANDADO ============ */
const CODIGO = '301125';
let intento = '';

const lockDots = document.getElementById('lockDots');
const lockPad = document.getElementById('lockPad');
const lockCard = document.getElementById('lockCard');

for(let i=0;i<CODIGO.length;i++){
  const dot = document.createElement('span');
  dot.className = 'lock-dot';
  lockDots.appendChild(dot);
}

const TECLAS = ['1','2','3','4','5','6','7','8','9','','0','back'];
TECLAS.forEach(t=>{
  const btn = document.createElement('button');
  if(t === ''){ btn.className = 'lock-key lock-key-empty'; btn.disabled = true; }
  else if(t === 'back'){ btn.className = 'lock-key lock-key-back'; btn.textContent = '⌫'; btn.addEventListener('click', borrar); }
  else { btn.className = 'lock-key'; btn.textContent = t; btn.addEventListener('click', ()=>pulsar(t, btn)); }
  lockPad.appendChild(btn);
});

function actualizarDots(){
  const dots = lockDots.querySelectorAll('.lock-dot');
  dots.forEach((d,i)=> d.classList.toggle('filled', i < intento.length));
}

function pulsar(digito, btn){
  if(intento.length >= CODIGO.length) return;
  btn.classList.remove('pressed');
  void btn.offsetWidth;
  btn.classList.add('pressed');
  intento += digito;
  actualizarDots();
  if(intento.length === CODIGO.length){
    setTimeout(comprobar, 150);
  }
}

function borrar(){
  intento = intento.slice(0,-1);
  actualizarDots();
  lockCard.classList.remove('error');
}

function comprobar(){
  if(intento === CODIGO){
    document.body.classList.add('unlocked');
  } else {
    lockCard.classList.add('error');
    setTimeout(()=>{
      intento = '';
      actualizarDots();
      lockCard.classList.remove('error');
    }, 500);
  }
}

document.addEventListener('keydown', (e)=>{
  if(document.body.classList.contains('unlocked')) return;
  if(e.key >= '0' && e.key <= '9'){
    const btn = [...lockPad.children].find(b=>b.textContent === e.key);
    if(btn) pulsar(e.key, btn);
  } else if(e.key === 'Backspace'){ borrar(); }
});

const START = new Date(2026,8,1);
const FINAL = new Date(2026,8,19);
const PREVIEW = new URLSearchParams(location.search).has('preview');

const DIAS = [
  { tipo:'letter', titulo:'Empieza la cuenta atrás', texto:'Amor,\n\nEsto que tienes delante es una cuenta atrás. No es solo una web, es mi manera de estar un poco contigo aunque no pueda tocarte: cada día, hasta el 19, se va a abrir algo aquí. Una carta, una foto, un vídeo. Todo para que el tiempo pese menos hasta que pueda volver a abrazarte, a besarte, a tenerte cerca otra vez.\n\nAhora mismo estás en Nueva York, con tu familia, y eso me hace muy feliz. Quiero que lo disfrutes al máximo, que no pienses ni un segundo en la distancia por mi culpa. Yo voy a estar aquí, contando los días, y hoy te dejo la primera foto que nos hicimos juntos. Así empezó todo.\n\nTe quiero.', extra:[{tipo:'photo', src:'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAZAAuMDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAIDAQQFBgcI/8QAUBAAAQQBAwIEAgYHBgMGBAMJAQACAxEEBRIhMUEGE1FhInEUMoGRodEHFSNCUrHBFiQzU2JyQ4LhJTRjc5LwRLLS8TVUk6LCFyZkgyeEo//EABsBAQEBAQEBAQEAAAAAAAAAAAABAgMEBQYH/8QAJxEBAQACAgICAwEBAAMBAQAAAAECEQMhEjEEEyJBUTJhBRQjJHH/2gAMAwEAAhEDEQA/APzwiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICI function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function formatDate(d){ return d.toLocaleDateString('es-ES', { day:'numeric', month:'long' }); }

/* --- transición noche -> amanecer, según lo cerca que estamos del 19 --- */
const hoyBase = new Date();
const ratio = Math.min(1, Math.max(0, (hoyBase - START) / (FINAL - START)));
document.documentElement.style.setProperty('--alba', Math.round(ratio*100) + '%');

const heroBg = document.getElementById('heroBg');

heroImg.src = 'assets/portada.jpg';

const floaty = document.getElementById('floaty');
const floatSymbols = ['♡','·','✦'];
for(let i=0;i<10;i++){
  const s = document.createElement('span');
  s.textContent = floatSymbols[i % floatSymbols.length];
  s.style.left = (Math.random()*90 + 5) + '%';
  s.style.color = i % 2 === 0 ? 'var(--vela)' : 'var(--brasa)';
  s.style.fontSize = (0.7 + Math.random()*0.8) + 'rem';
  s.style.animationDuration = (7 + Math.random()*6) + 's';
  s.style.animationDelay = (Math.random()*8) + 's';
  floaty.appendChild(s);
}

function burstHearts(){
  const colors = ['var(--brasa)','var(--vela)','var(--papel)'];
  for(let i=0;i<18;i++){
    const h = document.createElement('span');
    h.textContent = '♥';
    h.style.position='fixed'; h.style.left=(45+Math.random()*10)+'vw'; h.style.top='55vh';
    h.style.color=colors[i%colors.length];
    h.style.fontSize=(0.9+Math.random()*1.3)+'rem';
    h.style.zIndex='20'; h.style.pointerEvents='none'; h.style.opacity='0.9';
    const dx=(Math.random()-0.5)*220, dur=1.4+Math.random()*0.9;
    h.animate([
      { transform:'translate(0,0) scale(0.6)', opacity:0.9 },
      { transform:`translate(${dx}px, -${260+Math.random()*140}px) scale(1)`, opacity:0 }
    ], { duration:dur*1000, easing:'ease-out' });
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), dur*1000);
  }
}

const today = new Date();
const daysLeft = Math.max(0, Math.ceil((FINAL - new Date(today.getFullYear(),today.getMonth(),today.getDate())) / 86400000));
document.getElementById('countNumber').textContent = daysLeft;
document.getElementById('countLabel').textContent = daysLeft === 0
  ? 'hoy vuelves a casa'
  : (daysLeft === 1 ? 'día para volver a abrazarte' : 'días para volver a abrazarte');

const pathEl = document.getElementById('path');
let unlockedCount = 0;

DIAS.forEach((dia,i)=>{
  const date = addDays(START,i);
  const unlocked = PREVIEW || today >= new Date(date.getFullYear(),date.getMonth(),date.getDate());
  if(unlocked) unlockedCount++;
  const node = document.createElement('button');
  node.className = 'node ' + (unlocked ? 'unlocked' : 'locked');
  node.style.animationDelay = (0.9 + i*0.045) + 's';
  node.innerHTML = `
    <span class="node-circle">${unlocked ? (i+1) : '🔒'}</span>
    <span class="node-info">
      <span class="node-day">Día ${i+1}</span>
      <span class="node-date">${formatDate(date)}</span>
    </span>`;
  if(unlocked){ node.addEventListener('click', ()=>openDay(dia,i+1,date)); }
  pathEl.appendChild(node);
});

function closeCard(){ overlay.classList.remove('open'); }

const ICONS = { letter:'💌', photo:'📷', video:'🎬' };

function runDraw(finalTipo, onDone){
  drawEl.style.display = 'block';
  revealEl.classList.remove('show');
  revealBody.innerHTML = '';
  selloEl.style.animation = 'none';
  selloEl.textContent = ICONS[finalTipo] || '💌';
  void selloEl.offsetWidth;
  selloEl.style.animation = '';
  setTimeout(()=>{ drawEl.style.display='none'; onDone(); }, 760);
}

function typewrite(el, text, onComplete){
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  let i = 0;
  const tick = ()=>{
    el.textContent = text.slice(0,i);
    el.appendChild(cursor);
    i++;
    if(i <= text.length){ setTimeout(tick, 16); }
    else { cursor.remove(); if(onComplete) onComplete(); }
  };
  tick();
}

function mediaBlock(tipo, src, caption){
  const box = document.createElement('div');
  box.className = 'media-box';
  const el = document.createElement(tipo==='video' ? 'video' : 'img');
  if(tipo==='video'){ el.controls = true; el.playsInline = true; }
  else { el.alt = caption || ''; el.loading = 'lazy'; }
  el.src = src;
  el.onerror = ()=>{
    box.innerHTML = `<div class="media-fallback"><span class="icon">${tipo==='video' ? '🎬' : '📷'}</span>Añade tu ${tipo==='video'?'vídeo':'foto'} en<br><code>${src}</code></div>`;
  };
  box.appendChild(el);
  const wrap = document.createElement('div');
  wrap.appendChild(box);
  if(caption){
    const cap = document.createElement('p');
    cap.className = 'caption';
    cap.textContent = caption;
    wrap.appendChild(cap);
  }
  return wrap;
}

function openDay(dia, num, date){
  overlay.classList.add('open');
  revealDay.textContent = `Día ${num} — ${formatDate(date)}`;
  revealTitle.textContent = dia.titulo;
  runDraw(dia.tipo, ()=>{
    revealBody.innerHTML = '';
    if(dia.tipo === 'letter'){
      const p = document.createElement('p');
      p.className = 'letter-text';
      revealBody.appendChild(p);
      revealEl.classList.add('show');
      typewrite(p, dia.texto, ()=>{
        if(dia.extra){
          dia.extra.forEach(block=>{
            const el = mediaBlock(block.tipo, block.src, block.caption);
            el.style.marginTop = '18px';
            el.style.animation = 'desplegar 0.4s ease';
            revealBody.appendChild(el);
          });
        }
      });
    } else {
      revealBody.appendChild(mediaBlock(dia.tipo, dia.src, dia.caption));
      revealEl.classList.add('show');
    }
  });
}

function openFinal(){
  overlay.classList.add('open');
  revealDay.textContent = '19 de septiembre';
  revealTitle.textContent = CARTA_FINAL.titulo;
  runDraw('letter', ()=>{
    revealBody.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'letter-text';
    revealBody.appendChild(p);
    revealEl.classList.add('show');
    typewrite(p, CARTA_FINAL.texto);
    burstHearts();
  });
}
</script>
</body>
